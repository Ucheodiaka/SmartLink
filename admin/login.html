<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SmartLink Admin Login</title>

    <link
        rel="stylesheet"
        href="login.css"
    >

</head>


<body>

    <main class="login-page">

        <div class="login-card">

            <div class="brand">

                <div class="brand-mark">
                    S
                </div>

                <div>
                    <strong>
                        SmartLink
                    </strong>

                    <span>
                        ADMIN
                    </span>
                </div>

            </div>


            <div class="login-heading">

                <span>
                    ADMINISTRATION
                </span>

                <h1>
                    Welcome back
                </h1>

                <p>
                    Sign in to manage the SmartLink website.
                </p>

            </div>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="you@example.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    id="loginButton"
                >
                    Sign In
                </button>


                <p
                    id="loginMessage"
                    class="message"
                ></p>

            </form>

        </div>

    </main>


    <script
        type="module"
        src="auth.js"
    ></script>

</body>

</html>
