<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SmartLink Admin</title>

    <link
        rel="stylesheet"
        href="admin.css"
    >

</head>


<body>


    <main class="admin-container">

        <div class="admin-card">

            <div class="admin-heading">

                <span>
                    SMARTLINK ADMIN
                </span>

                <h1>
                    Website Settings
                </h1>

                <p>
                    Update information displayed on the SmartLink website.
                </p>

            </div>

            <button
    id="logoutButton"
    class="logout-button"
    type="button"
>
    Logout
</button>


            <div class="form-group">

                <label for="companyName">
                    Company Name
                </label>

                <input
                    type="text"
                    id="companyName"
                    placeholder="SmartLink Limited"
                    disabled
                >

            </div>


            <div class="form-group">

                <label for="tagline">
                    Tagline
                </label>

                <input
                    type="text"
                    id="tagline"
                    placeholder="Building Systems That Scale"
                >

            </div>


            <button
                id="saveButton"
                class="save-button"
                type="button"
            >
                Save Changes
            </button>


            <p
                id="message"
                class="message"
            ></p>

        </div>

    </main>


    <script
        type="module"
        src="admin.js"
    ></script>


</body>

</html>
